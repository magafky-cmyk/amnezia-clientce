name: Build Xeno VPN APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.6.0
      NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          dir: ${{ runner.temp }}
          setup-python: 'true'
          set-env: 'true'
          extra: '--external 7z'

      - name: Install NDK
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          if [ ! -f $ANDROID_NDK_ROOT/ndk-build ]; then
            wget https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip -q -O ${runner.temp}/ndk.zip
            unzip -q -d ${runner.temp} ${runner.temp}/ndk.zip
          fi

      - name: Build APK
        run: |
          export QT_BIN_DIR=${{ runner.temp }}/Qt/${QT_VERSION}/android_arm64_v8a/bin
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-vpn-debug
          path: client/android/build/outputs/apk/debug/*.apk
